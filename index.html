<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bartleby">
<meta name="theme-color" content="#161b26">
<title>Bartleby</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e8e3;--surface:#f3f5f1;--raise:#ffffff;--line:#c7cdc4;--ink:#1c2431;--muted:#5b6575;
  --clean:#2b8455;--slip:#c9392a;--brass:#9c7210;--track:#d5dbd2;--onacc:#ffffff;
  --f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s:"Instrument Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#151a24;--surface:#1d2430;--raise:#242c3a;--line:#2f3848;--ink:#e8e4d9;--muted:#8e97a7;
    --clean:#79cc98;--slip:#ff6a55;--brass:#e3b54a;--track:#2a3241;--onacc:#10151d;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#151a24;--surface:#1d2430;--raise:#242c3a;--line:#2f3848;--ink:#e8e4d9;--muted:#8e97a7;
  --clean:#79cc98;--slip:#ff6a55;--brass:#e3b54a;--track:#2a3241;--onacc:#10151d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:18px 18px calc(150px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.02rem;margin:22px 0 6px}
.small{font-size:.86rem}

.day{display:flex;align-items:center;gap:8px}
.day h1{font-size:2rem;line-height:1.1;flex:1}
.day .sub{font-size:.88rem;color:var(--muted);font-weight:400;letter-spacing:0;display:block;margin-top:2px}
.nav-d{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.2rem;line-height:1}
.nav-d:disabled{opacity:.3}
.today-link{border:0;background:none;color:var(--brass);font-weight:600;padding:4px 0}
.lvl{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.lvl .n{font-family:var(--s);font-style:italic;font-size:1.45rem;line-height:1}
.lvl .x{font-size:.82rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.xpbar{height:4px;background:var(--track);border-radius:2px;margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brass)}
.focus{margin-top:12px;padding-left:12px;border-left:3px solid var(--brass)}
.focus span{display:block;font-size:.78rem;color:var(--muted)}
.focus b{font-family:var(--s);font-weight:400;font-size:1.2rem;line-height:1.25}

.meter{margin:18px -6px 0}
.meter svg{display:block;width:100%;height:auto}
.needle{transform-origin:150px 150px;transition:transform 1.6s cubic-bezier(.2,.9,.25,1.12)}
.meter-read{text-align:center;margin-top:-4px}
.meter-read .b{font-family:var(--s);font-size:1.9rem;line-height:1.1}
.meter-read .d{font-size:.88rem;color:var(--muted)}
.meter-read .d b{font-variant-numeric:tabular-nums}
.ledger{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:18px;font-size:.9rem}
.bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.v{font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}

.card{border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;margin-top:20px}
.card .nm{font-size:1.05rem}
.card p{margin:4px 0 10px;font-size:.9rem;color:var(--muted)}

.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-h h2{font-size:1.15rem;flex:1}
.sec-h .act{border:0;background:none;color:var(--clean);font-weight:600;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .em{width:28px;text-align:center;font-size:1.25rem;flex:none}
.grow{flex:1;min-width:0}
.nm{font-weight:600;line-height:1.25}
.meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.mini{height:3px;background:var(--track);border-radius:2px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--clean)}
.seg{display:flex;border:1px solid var(--line);border-radius:22px;overflow:hidden;flex:none}
.seg button{width:48px;height:40px;border:0;background:transparent;font-size:1.05rem;font-weight:800}
.seg button+button{border-left:1px solid var(--line)}
.seg .on.ok{background:var(--clean);color:var(--onacc)}
.seg .on.no{background:var(--slip);color:var(--onacc)}
.rep{margin-top:6px;border:1px solid var(--clean);color:var(--clean);background:transparent;border-radius:14px;padding:3px 10px;font-size:.8rem;font-weight:600}
.rep.on{background:var(--clean);color:var(--onacc)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.1rem;font-weight:600}
.step input{width:52px;height:36px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-variant-numeric:tabular-nums;font-weight:600}
.check{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:800;flex:none}
.check.on{background:var(--clean);border-color:var(--clean);color:var(--onacc)}
.moods{display:flex;gap:6px;margin:10px 0}
.moods button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:1.3rem;opacity:.55}
.moods button.on{opacity:1;background:var(--raise);border-color:var(--ink)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:10px 12px;resize:vertical;line-height:1.5}

/* dopamin menüsü */
.menu{margin-top:6px}
.menu .cat{display:flex;align-items:baseline;gap:8px;margin:16px 0 2px}
.menu .cat b{font-family:var(--s);font-style:italic;font-weight:400;font-size:1.4rem}
.menu .cat span{font-size:.8rem;color:var(--muted)}
.mi{display:flex;align-items:baseline;gap:6px;width:100%;border:0;background:none;padding:7px 0;text-align:left}
.mi .t{font-weight:600}
.mi .ld{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.mi .pr{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.mi.on .t,.mi.on .pr{color:var(--clean)}
.mi.on .t::before{content:"✓ "}
.nomenu{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.nomenu s{margin-right:10px;white-space:nowrap}

.chain{padding:16px 0;border-bottom:1px solid var(--line)}
.chain-h{display:flex;align-items:baseline;gap:10px}
.chain-h .nm{flex:1}
.big{font-family:var(--s);font-size:2.2rem;line-height:1}
.chain-h .rec{font-size:.8rem;color:var(--muted);text-align:right}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:10px}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--track)}
.heat .ok{background:var(--clean)}
.heat .no{background:var(--slip)}
.heat .part{background:var(--brass);opacity:.6}
.heat .x{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.heat .t{box-shadow:inset 0 0 0 2px var(--ink)}
.wks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px}
.wk{aspect-ratio:1/1.3;border-radius:4px;background:var(--track);display:grid;place-items:center;font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.wk.ok{background:var(--clean);color:var(--onacc)}
.wk.part{background:var(--brass);color:var(--onacc);opacity:.75}
.wk.no{background:var(--slip);color:var(--onacc);opacity:.85}
.wk.x{background:transparent;outline:1px dashed var(--line);outline-offset:-1px;color:transparent}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--k)}

/* rozetler */
.mil{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bd{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--track);color:var(--muted);font-variant-numeric:tabular-nums}
.bd.on{background:var(--brass);color:var(--onacc)}
.gbs{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.gb{padding:12px 0;border-bottom:1px solid var(--line)}
.gb.off{opacity:.42}
.gb .nm::before{content:"◆ ";color:var(--brass)}
.gb.off .nm::before{color:var(--muted)}

.ch{padding:16px 0;border-bottom:1px solid var(--line)}
.ch-h{display:flex;gap:10px;align-items:baseline}
.ch-h .nm{flex:1;font-size:1.05rem}
.rw{font-size:.8rem;color:var(--brass);font-weight:600;white-space:nowrap}
.ch p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.prog{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--clean)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--track)}
.dots i.s{background:var(--clean)}
.dots i.f{background:var(--slip)}
.dots i.p{box-shadow:inset 0 0 0 2px var(--ink)}
.ch-f{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:.85rem;color:var(--muted)}
.ch-f .sp{flex:1}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn{border:0;border-radius:24px;background:var(--ink);color:var(--bg);font-weight:700;padding:11px 20px;min-height:44px}
.btn.sm{padding:7px 16px;min-height:36px;font-size:.9rem}
.btn.ok{background:var(--clean);color:var(--onacc)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{color:var(--slip);border-color:var(--slip)}
.btn.wide{width:100%;margin-top:14px}
.two{display:flex;gap:10px;margin-top:14px}
.two>*{flex:1}
.trophy{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.trophy .nm{flex:1}

.chart svg{display:block;width:100%;height:auto;margin-top:10px}
.figs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.fig{padding:14px 0;border-bottom:1px solid var(--line)}
.fig:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.fig:nth-child(even){padding-left:14px}
.fig .big{display:block}
.fig span{font-size:.84rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:8em 1fr 2em;gap:10px;align-items:center;padding:6px 0;font-size:.9rem}
.hbar .bar{height:8px}
.log{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log .grow{color:var(--muted)}
.risk{display:grid;grid-template-columns:2.6em repeat(6,1fr);gap:3px;margin-top:10px;font-size:.72rem;color:var(--muted);align-items:center}
.risk i{display:block;height:24px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.risk i b{position:absolute;inset:0;background:var(--slip)}
.risk .hd{text-align:center}
.kasa{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.kasa .grow{font-size:.92rem}
.kasa label{font-size:.72rem;color:var(--muted);text-align:center}
.kasa input{display:block;width:64px;height:34px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--raise);margin-top:2px}
.kasa-sum{display:flex;gap:18px;margin-top:14px}
.kasa-sum div{flex:1}
.kasa-sum span{display:block;font-size:.84rem;color:var(--muted)}

.f{display:block;font-size:.85rem;color:var(--muted);margin-top:12px}
.f input,.f select{display:block;width:100%;margin-top:4px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:0 12px;color:var(--ink);font-size:1rem}
.f textarea{margin-top:4px;min-height:74px;color:var(--ink)}
.cb{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.9rem}
.cb input{width:22px;height:22px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--track);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--raise);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--clean)}
.sw.on::after{left:25px}
.pills{display:flex;gap:6px}
.pills button{border:1px solid var(--line);background:transparent;border-radius:18px;padding:6px 12px;font-size:.88rem}
.pills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.arch{opacity:.5}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;height:56px;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button svg{width:20px;height:20px}
.tabs button.on{color:var(--ink)}
.sos{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:26px;height:48px;padding:0 20px;background:var(--slip);color:var(--onacc);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.sheet{position:fixed;inset:0;z-index:40}
.sheet[hidden],.lock[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(10,14,20,.55)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-t{font-family:var(--s);font-weight:400;font-size:1.9rem;line-height:1.1;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:18px;padding:7px 14px;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvls{display:flex;gap:6px;margin-top:6px}
.lvls button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700}
.lvls button.on{background:var(--slip);color:var(--onacc);border-color:var(--slip)}
.lvls.after button.on{background:var(--clean);border-color:var(--clean)}
.reasons{margin:6px 0 0;padding-left:20px}
.reasons li{font-family:var(--s);font-size:1.2rem;line-height:1.35;margin:4px 0}
.timer{display:grid;place-items:center;height:210px;position:relative;margin-top:10px}
.breath{position:absolute;width:190px;height:190px;border-radius:50%;background:var(--clean);opacity:.18;transform:scale(.55);transition:transform 4s ease-in-out}
.tm{font-family:var(--s);font-size:3.4rem;line-height:1;position:relative;font-variant-numeric:tabular-nums}
.bt{position:absolute;bottom:18px;font-size:.9rem;color:var(--muted)}
.help{font-size:.85rem;color:var(--muted);margin-top:18px}
.help a{color:var(--ink);font-weight:600}

.lock{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lk{display:flex;flex-direction:column;align-items:center;gap:18px}
.pdots{display:flex;gap:14px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pdots i.on{background:var(--ink)}
.pdots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.5rem;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.needle,.breath,.sw::after,.toast{transition:none}.sheet-body,.pdots.bad{animation:none}}

.chainl{display:block;font-size:.84rem;margin-top:3px;color:var(--ink)}
.chainl b{font-family:var(--s);font-size:1.2rem;font-weight:400}
.ratio{font-weight:700;color:var(--clean)}
.warn{display:block;font-size:.8rem;color:var(--slip);font-weight:600;margin-top:3px}
.seg.tri button{width:40px}
.inline{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.inline button.pm{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.inline b{min-width:1.2em;text-align:center;color:var(--ink)}
.tag{border:1px solid var(--line);background:transparent;border-radius:14px;padding:3px 10px;font-size:.78rem}
.tag.on{background:var(--clean);border-color:var(--clean);color:var(--onacc)}
.card.warn{border-color:var(--slip)}
.card.soft{border-style:dashed}
.card .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ema{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.ema button{height:38px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.85rem;padding:0}
.qi{padding:12px 0;border-bottom:1px solid var(--line)}
.qq{font-weight:600;margin-bottom:8px;line-height:1.35}
.qo{display:flex;flex-direction:column;gap:6px}
.qo button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;font-size:.92rem}
.qo button.on,.lvls.q7 button.on,.one button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bip{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.one{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.one button{border:1px solid var(--line);background:transparent;border-radius:18px;padding:7px 14px;font-size:.9rem;min-width:40px}
.rng{display:flex;align-items:center;gap:12px;margin-top:6px}
.rng input{flex:1;accent-color:var(--clean)}
.rng output{font-family:var(--s);font-size:1.5rem;min-width:1.6em;text-align:right}
.lbl{font-size:.85rem;color:var(--muted);margin-top:16px;display:block}
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-size:1.8rem}

 const arc=(a,b,rr)=>{const[x1,y1]=P(a,rr),[x2,y2]=P(b,rr);return`M${x1.toFixed(1)} ${y1.toFixed(1)} A${rr} ${rr} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};

function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(pass,salt);
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));return JSON.stringify({v:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
async function dec(str,pass){const o=JSON.parse(str);const k=await deriveKey(pass,ub64(o.s));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.i)},k,ub64(o.c));return JSON.parse(new TextDecoder().decode(pt))}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

async function push(){if(!SY.url||!SY.key||!SY.pass)throw new Error('Supabase ayarları eksik');if(!(window.crypto&&crypto.subtle))throw new Error('Şifreleme bu ortamda yok');
 const id=await sha('bartleby-id:'+SY.pass);const data=await enc(S,SY.pass);
 const r=await fetch(api(),{method:'POST',headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id,data,updated_at:new Date().toISOString()})});
 if(!r.ok)throw new Error('Sunucu yanıtı '+r.status);SY.last=Date.now();SY.err='';saveSY()}
async function pull(){if(!SY.url||!SY.key||!SY.pass)throw new Error('Supabase ayarları eksik');const id=await sha('bartleby-id:'+SY.pass);
 const r=await fetch(api()+'?id=eq.'+id+'&select=data,updated_at',{headers:hdr()});if(!r.ok)throw new Error('Sunucu yanıtı '+r.status);
 const rows=await r.json();if(!rows.length)throw new Error('Bu parolayla bir yedek bulunamadı');
 let o;try{o=await dec(rows[0].data,SY.pass)}catch(e){throw new Error('Parola yanlış ya da veri bozuk')}
 if(!o||!Array.isArray(o.habits))throw new Error('Geçersiz yedek');return o}

 case'pos':{const l=L(VD);const n=Math.max(0,(Number(l.pos[hid])||0)+Number(b.dataset.s));if(n)l.pos[hid]=n;else delete l.pos[hid];save();render();break}
 case'soft':{const l=L(VD);l.soft[hid]=!l.soft[hid];if(!l.soft[hid])delete l.soft[hid];save();render();break}
 case'allok':{const l=L(VD);let n=0;active('abstain').forEach(h=>{if(!l.h[h.id]){l.h[h.id]='ok';n++}});save();render();toast(n?`${n} kural temiz işaretlendi.`:'Hepsi zaten işaretli.');break}
 case'step':{const h=H(hid),l=L(VD),s=Number(b.dataset.s);const n=Math.max(0,(Number(l.h[hid])||0)+s);if(n)l.h[hid]=n;else delete l.h[hid];save();render();
  if(h.type==='daily'&&n>=h.target&&n-s<h.target)toast('Günün hedefi tamam.');

 case'sleep':{const l=L(VD);const n=Math.max(0,Math.min(16,(l.sleep??7)+Number(b.dataset.s)));l.sleep=n;save();render();break}
 case'chk':{const l=L(VD),c=b.dataset.c;l.ch[c]=!l.ch[c];if(!l.ch[c])delete l.ch[c];save();render();break}
 case'menu':{const l=L(VD),m=b.dataset.m;l.menu[m]=!l.menu[m];if(!l.menu[m])delete l.menu[m];save();render();break}
 case'mood':{const l=L(VD),m=Number(b.dataset.m);l.mood=l.mood===m?0:m;save();render();break}
 case'ema':S.ema[today()]={v:Number(b.dataset.n),ts:Date.now()};save();render();toast('Kaydedildi.');break;
 case'snooze':S.supportSnooze=add(today(),7);save();render();break;

 case'plainNo':S.settings.plainAsked=true;save();render();break;
 case'q':qSheet(b.dataset.k);break;
 case'qa':{QA[Number(b.dataset.i)]=Number(b.dataset.n);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));break}
 case'qSave':{const miss=QA.filter(x=>x==null).length;if(miss){toast(`${miss} soru boş.`);break}const q=Q[QK];const s=q.score(QA);

 case'review':reviewSheet(b.dataset.w);break;
 case'saveRv':{const w=b.dataset.w;const r={w:$('#rv1').value.trim(),t:$('#rv2').value.trim(),f:$('#rv3').value.trim(),ts:Date.now()};

 case'shield':{const id=b.dataset.s;if(S.shields[id])delete S.shields[id];else S.shields[id]=Date.now();save();render();break}
 case'plan':planSheet(b.dataset.id||null,{if:b.dataset.if||'',day:b.dataset.day??'*',band:b.dataset.band??'*'});break;

  const id=b.dataset.id;if(id)Object.assign(S.intim.find(x=>x.id===id),o);else S.intim.push(Object.assign({id:'i'+Date.now(),d:VD,ts:Date.now()},o));

 case'rm':S.challenges=S.challenges.filter(c=>c.cid!==b.dataset.c);save();render();break;
 case'restart':{const o=S.challenges.find(c=>c.cid===b.dataset.c);if(!o)break;const n=Object.assign({},o,{cid:'c'+Date.now(),start:today()});S.challenges=S.challenges.filter(c=>c.cid!==o.cid);S.challenges.push(n);save();render();toast('Yeniden başladı.');break}
 case'newH':habitSheet(null);break;

   tri:$('#fTri').checked,triGoal:$('#fTG').value,repair:$('#fR').checked,pos:$('#fPos').checked,gamble:$('#fGam').checked,porn:$('#fPor').checked};
  if(hid){Object.assign(H(hid),o)}else{S.habits.push(Object.assign({id:'h'+Date.now()},o))}save();closeSheet();render();toast('Kaydedildi.');break}
 case'archH':{const h=H(hid);h.archived=!h.archived;save();closeSheet();render();break}
 case'delH':if(confirm('Kural ve tüm kayıtları silinsin mi? Arşivlemek geçmişi korur.')){S.habits=S.habits.filter(h=>h.id!==hid);for(const d in S.logs){const l=S.logs[d];['h','trig','st','rep','pos','soft'].forEach(k=>{if(l[k])delete l[k][hid]})}save();closeSheet();render()}break;
 case'saveMenu':{const nm={};MCAT.forEach(([c])=>nm[c]=$('#m_'+c).value.split('\n').map(s=>s.trim()).filter(Boolean));S.menu=buildMenu(nm);save();render();toast('Menü güncellendi.');break}
 case'saveR':S.reasons=$('#rs').value.split('\n').map(s=>s.trim()).filter(Boolean);save();toast('Nedenler kaydedildi.');break;
 case'discreet':S.settings.discreet=!S.settings.discreet;save();render();break;
 case'plain':S.settings.plain=!S.settings.plain;S.settings.plainAsked=true;save();render();break;
 case'theme':S.settings.theme=b.dataset.t;applyTheme();save();render();break;
 case'setStart':{const v=$('#sd').value;if(v&&v<=today()){S.startDate=v;save();render();toast('Başlangıç güncellendi.')}break}

 case'syncPull':if(confirm('Buluttaki yedek bu cihazdaki verinin yerine geçecek. Devam?'))pull().then(o=>{S=migrate(o);save();applyTheme();render();toast('Buluttan yüklendi.')}).catch(err=>toast(err.message));break;
 case'pinSet':pinSheet();break;
 case'pinSave':{const p1=$('#p1').value,p2=$('#p2').value;if(!/^\d{4}$/.test(p1)){toast('PIN dört rakam olmalı.');break}if(p1!==p2){toast('İki PIN aynı değil.');break}
  hp(p1).then(h=>{S.pin=h;save();closeSheet();render();toast('PIN kilidi açık.')});break}
 case'pinOff':if(confirm('PIN kilidi kaldırılsın mı?')){S.pin=null;save();render();toast('PIN kaldırıldı.')}break;
 case'pk':{const k=b.dataset.k;if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;updDots();
  if(pinBuf.length===4){const tryP=pinBuf;hp(tryP).then(h=>{if(h===S.pin){$('#lock').hidden=true;$('#lock').innerHTML='';pinBuf='';render()}
   else{pinBuf='';const pd=$('#pd');if(pd){pd.classList.remove('bad');void pd.offsetWidth;pd.classList.add('bad')}setTimeout(updDots,300)}})}break}
 case'forgot':if(confirm('PIN olmadan veriye erişilemez. Tüm veriyi silip sıfırlamak istiyor musun?')&&confirm('Emin misin? Bu geri alınamaz.')){S=defState();S.seen=true;save();applyTheme();$('#lock').hidden=true;$('#lock').innerHTML='';VD=today();TAB='today';render()}break;
 case'export':copyText(JSON.stringify(S),'Yedek panoya kopyalandı.');break;
 case'import':sheet(`<h2 class="sh-t">Yedekten yükle</h2><p class="muted">Kopyaladığın yedeği yapıştır. Mevcut veri tamamen değişir.</p><textarea id="imp" style="min-height:160px"></textarea><button class="btn wide" data-a="doImport">Yükle</button>`);break;
 case'doImport':{try{const o=JSON.parse($('#imp').value);if(!o||!Array.isArray(o.habits)||typeof o.logs!=='object')throw 0;S=migrate(o);save();applyTheme();closeSheet();render();toast('Yedek yüklendi.')}catch(err){toast('Bu metin geçerli bir yedek değil.')}break}
 case'reset':if(confirm('Tüm kayıtlar, görevler ve ayarlar silinecek. Emin misin?')){S=defState();S.seen=true;save();applyTheme();VD=today();TAB='today';render()}break;
 }});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.in;if(!k)return;
 if(k==='num'){const l=L(VD),n=Math.max(0,parseInt(t.value)||0);if(n)l.h[t.dataset.h]=n;else delete l.h[t.dataset.h];save();render()}
 else if(k==='sleep'){const l=L(VD);if(t.value==='')delete l.sleep;else l.sleep=Math.max(0,Math.min(16,Number(t.value)||0));save();render()}
 else if(k==='cost'||k==='mins'){const h=H(t.dataset.h);if(h){h[k]=Math.max(0,Number(t.value)||0);save();render()}}
 else if(k==='jarN'){S.jar.name=t.value.trim();save();render()}
 else if(k==='jarT'){S.jar.target=Math.max(0,Number(t.value)||0);save();render()}
 else if(k==='lossPast'){S.loss.past=Math.max(0,Number(t.value)||0);save();render()}
 else if(k==='partner'){S.settings.partner=t.value.trim()||'Partner';save()}
 else if(k==='intimTarget'){S.settings.intimTarget=Math.max(0,parseInt(t.value)||0);save()}});
let nt=null;document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.in==='note'){const v=t.value,d=VD;clearTimeout(nt);nt=setTimeout(()=>{L(d).note=v;save()},400)}
 if(t.dataset.in==='rng'){const o=document.getElementById(t.dataset.o);if(o)o.textContent=t.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}
 if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&$('#lock').hidden){showLock();return}
 if(TAB==='today'&&$('#sheet').hidden){if(VD>today())VD=today();render()}});

if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
if(S.pin)showLock();
else if(!S.seen){S.seen=true;S.notice5=true;save();
 sheet(`<h2 class="sh-t">Yapmamayı tercih ederim.</h2>

 <p class="muted">Dürtü geldiğinde sağ alttaki kırmızı düğme. Görev sekmesinde Kalkanlar ve Eğer–o zaman planları var; en çok işe yarayan kısımlar orası.</p>

 <button class="btn wide" data-a="close">Başla</button>`)}
